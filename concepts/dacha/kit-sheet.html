<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/assets/dacha/fonts/fonts.css"><link rel="stylesheet" href="/assets/dacha/tokens.css">
<style>
body{margin:0;padding:24px;background:var(--dacha-linen);font-family:var(--dacha-text);color:var(--dacha-ink);display:grid;grid-template-columns:repeat(6,1fr);gap:18px;align-items:center}
h2{grid-column:1/-1;margin:8px 0 0;font:900 22px/1 var(--dacha-display);color:var(--dacha-vermilion-lo)}
.f{position:relative;width:150px;height:150px}.f img{position:absolute}.f .p{left:6.8px;top:6.8px;width:136.4px;height:136.4px;border-radius:50%}.f .fr{inset:0;width:150px}
.f span{position:absolute;bottom:-20px;width:100%;text-align:center;font:700 13px var(--dacha-display)}
.wide{grid-column:span 3}.w2{grid-column:span 2}
.ic{display:flex;flex-wrap:wrap;gap:12px;grid-column:1/-1;color:var(--dacha-ink)}.ic svg{width:30px;height:30px}
.tb{grid-column:1/-1;display:flex;gap:16px;align-items:flex-start;background:url(/assets/dacha/table/floor.webp) 0 0/512px;padding:16px;border-radius:12px}
</style></head><body>
<h2>Portraits + frame</h2>
<script>
for (const id of ['kostya','dasha','misha','lev','zina','sveta','grisha','you'])
  document.write(`<div class="f"><img class="p" src="/assets/dacha/portraits/${id}.svg"><img class="fr" src="/assets/dacha/portraits/frame.svg"><span>${id}</span></div>`);
</script>
<h2>Brand</h2>
<img class="wide" src="/assets/dacha/brand/lockup.svg" style="width:100%">
<img class="w2" src="/assets/dacha/brand/wordmark-en.svg" style="width:100%">
<img src="/assets/dacha/brand/jester-cap.svg" style="width:120px">
<h2>Backs + illustrations</h2>
<img src="/assets/dacha/backs/gzhel.webp" style="width:130px"><img src="/assets/dacha/backs/khokhloma.webp" style="width:130px"><img src="/assets/dacha/backs/stitch.webp" style="width:130px">
<img src="/assets/dacha/illustrations/durak-en.svg" style="width:100%"><img src="/assets/dacha/illustrations/safe-ru.svg" style="width:100%"><img src="/assets/dacha/illustrations/durak-ru.webp" style="width:100%">
<h2>Icons</h2>
<div class="ic" id="ic"></div>
<script>
fetch('/assets/dacha/manifest.json').then(r=>r.json()).then(m=>{
  const box=document.getElementById('ic');
  for (const k of Object.keys(m.icons.items)) box.insertAdjacentHTML('beforeend',`<svg title="${k}"><use href="/assets/dacha/icons/sprite.svg#i-${k}"/></svg>`);
});
</script>
<h2>Tables (green / cobalt / vermilion) + props</h2>
<div class="tb"><img src="/assets/dacha/table/table-desktop@1x.webp" style="width:420px"><img src="/assets/dacha/table/table-desktop-cobalt@1x.webp" style="width:300px"><img src="/assets/dacha/table/table-mobile-vermilion.webp" style="width:130px">
<img src="/assets/dacha/props/samovar.svg" style="width:150px"><img src="/assets/dacha/props/rowan.svg" style="width:130px"></div>
</body></html>
