<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" width="250" height="350">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5bc2"/>
      <stop offset="1" stop-color="#1d469f"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.6" fill="#ffffff" fill-opacity=".22"/>
      <circle cx="0" cy="0" r="1.1" fill="#ffffff" fill-opacity=".14"/>
      <circle cx="16" cy="16" r="1.1" fill="#ffffff" fill-opacity=".14"/>
    </pattern>
    <path id="petal" d="M0 0 C -15 -10 -15 -34 0 -44 C 15 -34 15 -10 0 0Z"/>
    <path id="lf" d="M0 0 C 8 -9 20 -10 28 -4 C 20 3 8 4 0 0Z"/>
  </defs>
  <!-- porcelain-white stock -->
  <rect width="250" height="350" rx="13" fill="#fdfbf5"/>
  <!-- cobalt field -->
  <rect x="11" y="11" width="228" height="328" rx="8" fill="url(#field)"/>
  <rect x="11" y="11" width="228" height="328" rx="8" fill="url(#dots)"/>
  <rect x="18" y="18" width="214" height="314" rx="5" fill="none" stroke="#fdfbf5" stroke-width="2"/>
  <rect x="23" y="23" width="204" height="304" rx="3" fill="none" stroke="#fdfbf5" stroke-width=".9" stroke-opacity=".7"/>
  <!-- central white medallion with cobalt flower (Gzhel inverse) -->
  <g transform="translate(125 175)">
    <ellipse rx="66" ry="80" fill="#fdfbf5"/>
    <ellipse rx="58" ry="72" fill="none" stroke="#2350b4" stroke-width="1.6"/>
    <g fill="#2350b4">
      <use href="#petal" transform="rotate(0)"/>
      <use href="#petal" transform="rotate(72)"/>
      <use href="#petal" transform="rotate(144)"/>
      <use href="#petal" transform="rotate(216)"/>
      <use href="#petal" transform="rotate(288)"/>
    </g>
    <g fill="#fdfbf5">
      <path d="M0 -8 C -6 -14 -6 -28 0 -34 C 6 -28 6 -14 0 -8Z" transform="rotate(0)"/>
      <path d="M0 -8 C -6 -14 -6 -28 0 -34 C 6 -28 6 -14 0 -8Z" transform="rotate(72)"/>
      <path d="M0 -8 C -6 -14 -6 -28 0 -34 C 6 -28 6 -14 0 -8Z" transform="rotate(144)"/>
      <path d="M0 -8 C -6 -14 -6 -28 0 -34 C 6 -28 6 -14 0 -8Z" transform="rotate(216)"/>
      <path d="M0 -8 C -6 -14 -6 -28 0 -34 C 6 -28 6 -14 0 -8Z" transform="rotate(288)"/>
    </g>
    <circle r="11" fill="#c8361f"/>
    <circle r="11" fill="none" stroke="#fdfbf5" stroke-width="2.4"/>
    <circle r="4" fill="#f2c14e"/>
    <!-- small leaves between petals -->
    <g fill="#2350b4">
      <use href="#lf" transform="rotate(-54) translate(30 0) scale(.8)"/>
      <use href="#lf" transform="rotate(18) translate(30 0) scale(.8)"/>
      <use href="#lf" transform="rotate(90) translate(30 0) scale(.8)"/>
      <use href="#lf" transform="rotate(162) translate(30 0) scale(.8)"/>
      <use href="#lf" transform="rotate(234) translate(30 0) scale(.8)"/>
    </g>
  </g>
  <!-- corner drops -->
  <g fill="#fdfbf5">
    <circle cx="40" cy="40" r="5"/><circle cx="210" cy="40" r="5"/><circle cx="40" cy="310" r="5"/><circle cx="210" cy="310" r="5"/>
    <circle cx="125" cy="48" r="4"/><circle cx="125" cy="302" r="4"/>
    <circle cx="111" cy="52" r="2.4"/><circle cx="139" cy="52" r="2.4"/><circle cx="111" cy="298" r="2.4"/><circle cx="139" cy="298" r="2.4"/>
  </g>
</svg>
