<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Durak · New game — Atelier</title>
<link rel="stylesheet" href="css/atelier.css">
<link rel="stylesheet" href="css/title.css">
<link rel="stylesheet" href="css/lobby.css">
<script>
  (function () {
    var q = new URLSearchParams(location.search).get('theme');
    if (q) document.documentElement.setAttribute('data-theme', q);
  })();
</script>
</head>
<body class="page-title page-lobby">

<header class="nav">
  <a class="nav-brand" href="index.html" aria-label="Durak">
    <span class="mark serif">Д</span>
    <span class="nav-word serif">Durak</span>
  </a>
  <nav class="nav-links" aria-label="Primary">
    <a href="lobby.html" aria-current="page">Play</a>
    <a href="#">Watch</a>
    <a href="#">Stats</a>
    <a href="#">Rules</a>
  </nav>
  <div class="nav-right">
    <div class="seg theme-seg" role="group" aria-label="Appearance">
      <button aria-pressed="true" data-theme-set="light" aria-label="Light">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
      </button>
      <button aria-pressed="false" data-theme-set="dark" aria-label="Dark">
        <svg class="ico" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      </button>
    </div>
    <button class="me-chip" aria-label="Your profile"><span class="me-ava">Т</span><span class="me-name">Theo</span></button>
  </div>
</header>

<main class="lobby">
  <header class="lb-head">
    <div class="lb-head-text">
      <a class="lb-back" href="index.html"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Back</a>
      <div class="eyebrow">New game · Podkidnoy</div>
      <h1 class="serif">Set the table</h1>
    </div>
    <footer class="lb-foot">
      <div class="lb-summary">
      <span class="sum-main serif">5 players · Expert</span>
      <span class="sum-sub">Podkidnoy<span class="long"> · throw-in from all</span> · ~12 min</span>
      </div>
      <a class="btn btn--primary btn-start" href="table.html">Deal the cards<svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </footer>
  </header>

  <div class="lb-grid">
    <!-- Players -->
    <section class="lb-card players">
      <div class="lb-title">
        <h2>Players</h2>
        <span class="lb-hint">You + 4 bots</span>
      </div>
      <div class="count" role="radiogroup" aria-label="Number of players">
        <button role="radio" aria-checked="false">2</button>
        <button role="radio" aria-checked="false">3</button>
        <button role="radio" aria-checked="false">4</button>
        <button role="radio" aria-checked="true">5</button>
        <button role="radio" aria-checked="false">6</button>
      </div>
      <div class="seats" aria-hidden="true">
        <div class="seat-table"></div>
        <div class="seat s-you"><span class="you-ava">You</span></div>
        <div class="seat s1"><img src="img/avatars/kostya.svg" alt=""><span>Kostya</span></div>
        <div class="seat s2"><img src="img/avatars/zina.svg" alt=""><span>Zina</span></div>
        <div class="seat s3"><img src="img/avatars/misha.svg" alt=""><span>Misha</span></div>
        <div class="seat s4"><img src="img/avatars/sveta.svg" alt=""><span>Sveta</span></div>
        <div class="seat s5 is-empty"><img src="img/avatars/lev.svg" alt=""><span>Lev</span></div>
        <div class="seat-deck" data-back></div>
      </div>
    </section>

    <!-- Difficulty -->
    <section class="lb-card diff">
      <div class="lb-title">
        <h2>Difficulty</h2>
        <span class="lb-hint">Bots adapt their play, not their luck</span>
      </div>
      <div class="levels" role="radiogroup" aria-label="Difficulty">
        <button class="level" role="radio" aria-checked="false">
          <span class="lv-num serif">I</span>
          <span class="lv-name">Novice</span>
          <span class="lv-desc">Plays the obvious card. Forgets what left the table.</span>
          <span class="lv-meter"><i class="on"></i><i></i><i></i><i></i></span>
          <span class="lv-elo">~ 900</span>
        </button>
        <button class="level" role="radio" aria-checked="false">
          <span class="lv-num serif">II</span>
          <span class="lv-name">Intermediate</span>
          <span class="lv-desc">Saves trumps, throws in matching ranks.</span>
          <span class="lv-meter"><i class="on"></i><i class="on"></i><i></i><i></i></span>
          <span class="lv-elo">~ 1250</span>
        </button>
        <button class="level is-selected" role="radio" aria-checked="true">
          <span class="lv-check"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg></span>
          <span class="lv-num serif">III</span>
          <span class="lv-name">Expert</span>
          <span class="lv-desc">Counts every card and plans the endgame.</span>
          <span class="lv-meter"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span>
          <span class="lv-elo">~ 1600</span>
        </button>
        <button class="level" role="radio" aria-checked="false">
          <span class="lv-num serif">IV</span>
          <span class="lv-name">Grandmaster</span>
          <span class="lv-desc">Searches the whole game tree. Rarely forgives.</span>
          <span class="lv-meter"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span>
          <span class="lv-elo">~ 2000</span>
        </button>
      </div>
    </section>

    <!-- House rules -->
    <section class="lb-card rules">
      <div class="lb-title"><h2>House rules</h2></div>
      <label class="row"><span><b>Everyone may throw in</b><small>Not only the attacker’s neighbours</small></span><input type="checkbox" class="sw" checked></label>
      <label class="row"><span><b>Transfer · Переводной</b><small>Pass the attack on with a matching rank</small></span><input type="checkbox" class="sw"></label>
      <label class="row"><span><b>Show win chance</b><small>A live estimate from the engine</small></span><input type="checkbox" class="sw" checked></label>
      <label class="row"><span><b>Hints</b><small>Three per game</small></span><input type="checkbox" class="sw" checked></label>
    </section>
  </div>

</main>

<script src="js/cards.js"></script>
<script>
  (function () {
    const root = document.documentElement;
    const sync = () => document.querySelectorAll('[data-theme-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeSet === root.getAttribute('data-theme'))));
    document.querySelectorAll('[data-theme-set]').forEach((b) => b.addEventListener('click', () => { root.setAttribute('data-theme', b.dataset.themeSet); sync(); }));
    sync();
    const radio = (sel) => document.querySelectorAll(sel).forEach((b, _, all) => b.addEventListener('click', () => {
      all.forEach((x) => { x.setAttribute('aria-checked', 'false'); x.classList.remove('is-selected'); });
      b.setAttribute('aria-checked', 'true'); b.classList.add('is-selected');
      const chk = document.querySelector('.lv-check');
      if (b.classList.contains('level') && chk) b.prepend(chk);
      update();
    }));
    radio('.count button'); radio('.level');
    function update() {
      const n = +document.querySelector('.count [aria-checked="true"]').textContent;
      const lv = document.querySelector('.level[aria-checked="true"] .lv-name').textContent;
      document.querySelector('.sum-main').textContent = `${n} players · ${lv}`;
      document.querySelector('.players .lb-hint').textContent = `You + ${n - 1} bot${n > 2 ? 's' : ''}`;
      document.querySelectorAll('.seat:not(.s-you)').forEach((s, i) => s.classList.toggle('is-empty', i >= n - 1));
    }
  })();
</script>
</body>
</html>
